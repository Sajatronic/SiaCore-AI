# Hard-drop patterns — article rejected if any match (unless auto-pass provider)
negative_keywords:
  - football
  - soccer
  - basketball
  - baseball
  - celebrity
  - movie premiere
  - album release
  - reality tv
  - fashion week
  - recipe
  - horoscope
  - astrology
  - gaming tournament
  - esports


# Provider-specific pre-filter rules
provider_rules:

  gdacs:
    auto_pass: true
    min_score: 0.0

  gdelt:
    auto_pass: false
    min_score: 0.40

  marketaux:
    auto_pass: false
    min_score: 0.35

  gnews:
    auto_pass: false
    min_score: 0.45

  newsdata:
    auto_pass: false
    min_score: 0.45