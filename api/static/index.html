<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SiaEye — SiaCore Intelligence</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
    <link rel="stylesheet" href="/styles.css?v=map-alerts1" />
  </head>
  <body>
    <div class="shell">
      <header class="header">
        <div class="brand">
          <img src="/logo.svg" alt="SiaCore" class="logo" />
          <div>
            <div class="product">SiaEye</div>
            <h1>Sia<span>Core</span></h1>
            <p id="tagline">Ancient Wisdom. Modern Intelligence.</p>
          </div>
        </div>
        <div class="meta" id="meta"></div>
      </header>

      <section class="stats" id="stats"></section>

      <div class="intel-grid">
        <section class="panel map-panel">
          <div class="panel-head">
            <h2>Geo Intelligence</h2>
            <span class="panel-hint" id="map-hint">Events with coordinates</span>
          </div>
          <div id="geo-map" class="geo-map" role="img" aria-label="Event severity map"></div>
        </section>

        <aside class="panel alerts-panel">
          <div class="panel-head">
            <h2>Active Alerts</h2>
            <span class="alert-count" id="alert-count">0</span>
          </div>
          <div id="alerts" class="alerts-list"></div>
        </aside>
      </div>

      <section class="panel">
        <div class="panel-head">
          <h2>Risk Events</h2>
          <input id="search" type="search" placeholder="Search events..." />
        </div>
        <div id="events" class="events"></div>
      </section>

      <p class="footer">SiaEye by SiaCore — Supply Chain Intelligence</p>
    </div>

    <dialog id="detail">
      <article id="detail-body"></article>
      <button id="close-detail">Close</button>
    </dialog>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    <script src="/app.js?v=map-alerts1"></script>
  </body>
</html>
